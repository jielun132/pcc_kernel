name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Offline regression tests
        run: |
          node --version
          python -m pytest -q tests/unit
      - name: Append-only SQL case history
        run: python scripts/check_case_catalog.py --base-auto
      - name: Doctor and synthetic report
        run: |
          pcc doctor
          python scripts/make_demo.py --out demo-output/ci
          pcc diff --result-dir demo-output/ci --out demo-output/ci-offline || code=$?
          test "${code:-0}" -eq 3
      - name: Build wheel and source distribution
        run: python -m build --no-isolation
